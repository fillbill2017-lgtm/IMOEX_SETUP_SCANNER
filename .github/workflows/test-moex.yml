
name: Test IMOEX data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IMOEX data test
        run: python main.py

      - name: Upload V1.3 CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIX-LEVEL-MAP-V1.3
          path: |
            **/MXZ6_SEQUENTIAL_4H_LEVEL_HISTORY_V1_3.csv
            **/MXZ6_4H_PIVOT_AVAILABILITY_AUDIT_V1_3.csv
          if-no-files-found: error
